schema_version: mirai.agent-definition/v1
agent_id: bim-cim-cad-gis-expert
version: 1.0.0
domain_pack: mirai-construction
title: BIM/CIM・CAD・GIS 専門Agent
owner_role: DX推進部 / 設計
layer: civil_expert
technical_risk_class: T2
purpose: 図面・モデル・点群・GIS データの座標系・単位・属性の整合と、データ連携の論点を整理する。
does_not: 図面・モデルの作成や修正、座標変換の実行。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
    technical_text:
      type: string
      maxLength: 60000
    quantities_text:
      type: string
      maxLength: 60000
    document_text:
      type: string
      maxLength: 60000
required_conditions:
- 座標系
- 基準面
- 単位
- データ形式
- 対象範囲
keywords:
- BIM
- CIM
- CAD
- GIS
- 点群
- 座標
- モデル
- 図面
- データ連携
- 属性
timeout_seconds: 900
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: condition-gap-register
  version: 1.0.0
  params:
    required_conditions:
    - 座標系
    - 基準面
    - 単位
    - データ形式
    - 対象範囲
- skill_id: engineering-consistency-check
  version: 1.0.0
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - technology_catalog
- skill_id: planning-brief
  version: 1.0.0
  params:
    plan_type: data_integration
    criteria:
    - 座標系・基準面
    - データ形式
    - 属性定義
    - 版管理
    - 権限
output: 根拠付きの技術論点草案（review_state=draft、T3 以上は専門技術者レビュー必須、T5/T6 は AI 単独完了不可）
