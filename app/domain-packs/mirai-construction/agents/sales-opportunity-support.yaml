schema_version: mirai.agent-definition/v1
agent_id: sales-opportunity-support
version: 1.0.0
domain_pack: mirai-construction
title: 営業・案件形成支援
owner_role: 営業本部
layer: organization
org_code: '02'
technical_risk_class: T2
purpose: 引合・入札の内容から、承認済みの施工実績・技術資料を集め、提案の論点（確認済み／未確認）を整理する。技術的な判断は技術本部の Agent に委譲し、営業側で完結させない。
does_not: 受注可否・価格・契約条件の決定、提案書の正式発行、顧客への送信、技術判断の営業 Agent 内での確定。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
delegates_to:
- project-case-research
- technology-selection
timeout_seconds: 600
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - project_case
    - technology_catalog
- skill_id: planning-brief
  version: 1.0.0
  params:
    plan_type: proposal
- skill_id: decision-log-draft
  version: 1.0.0
output: 論点・根拠・不明点を含む草案（review_state=draft、人間レビュー必須）
