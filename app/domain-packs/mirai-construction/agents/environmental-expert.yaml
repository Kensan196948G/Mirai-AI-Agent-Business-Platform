schema_version: mirai.agent-definition/v1
agent_id: environmental-expert
version: 1.0.0
domain_pack: mirai-construction
title: 環境 専門Agent
owner_role: 環境技術（安全品質環境本部）
layer: civil_expert
technical_risk_class: T3
purpose: 環境保全（濁り・騒音・振動・生態・廃棄物）の論点と承認済み環境技術の適用条件を整理する。
does_not: 環境影響の定量評価の確定、法令適合の判断。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
    technical_text:
      type: string
      maxLength: 60000
    quantities_text:
      type: string
      maxLength: 60000
    document_text:
      type: string
      maxLength: 60000
required_conditions:
- 環境項目
- 対象地域
- 工種
- 施工時期
- 規制値
keywords:
- 環境
- 濁り
- 汚濁
- 騒音
- 振動
- 生態
- 水質
- 廃棄物
- 影響評価
- 海洋環境
timeout_seconds: 900
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: condition-gap-register
  version: 1.0.0
  params:
    required_conditions:
    - 環境項目
    - 対象地域
    - 工種
    - 施工時期
    - 規制値
- skill_id: standard-reference-check
  version: 1.0.0
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - technology_catalog
- skill_id: applicability-gap-check
  version: 1.0.0
- skill_id: risk-assessment
  version: 1.0.0
  params:
    domain: general
- skill_id: evidence-backed-draft
  version: 1.0.0
output: 根拠付きの技術論点草案（review_state=draft、T3 以上は専門技術者レビュー必須、T5/T6 は AI 単独完了不可）
