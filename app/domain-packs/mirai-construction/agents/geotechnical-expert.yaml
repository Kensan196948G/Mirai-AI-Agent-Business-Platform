schema_version: mirai.agent-definition/v1
agent_id: geotechnical-expert
version: 1.0.0
domain_pack: mirai-construction
title: 地盤 専門Agent
owner_role: 地盤技術（技術本部）
layer: civil_expert
technical_risk_class: T4
purpose: 地盤条件（N 値・土質・地下水位・層厚）の充足を確認し、承認済み資料を根拠に地盤改良・液状化対策の候補と適用条件を整理する。条件が無ければ未確定として扱う。
does_not: 地盤定数の推定、工法の確定、設計計算。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
    technical_text:
      type: string
      maxLength: 60000
    quantities_text:
      type: string
      maxLength: 60000
    document_text:
      type: string
      maxLength: 60000
required_conditions:
- N値
- 土質
- 地下水位
- 層厚
- 対象構造物
keywords:
- 地盤
- 土質
- N値
- 液状化
- 軟弱
- 改良
- 圧密
- 沈下
- 地下水
- CPG
timeout_seconds: 900
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: condition-gap-register
  version: 1.0.0
  params:
    required_conditions:
    - N値
    - 土質
    - 地下水位
    - 層厚
    - 対象構造物
- skill_id: standard-reference-check
  version: 1.0.0
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - technology_catalog
    - project_case
- skill_id: applicability-gap-check
  version: 1.0.0
- skill_id: technology-comparison
  version: 1.0.0
- skill_id: engineering-consistency-check
  version: 1.0.0
- skill_id: evidence-backed-draft
  version: 1.0.0
output: 根拠付きの技術論点草案（review_state=draft、T3 以上は専門技術者レビュー必須、T5/T6 は AI 単独完了不可）
