schema_version: mirai.agent-definition/v1
agent_id: structural-expert
version: 1.0.0
domain_pack: mirai-construction
title: 構造 専門Agent
owner_role: 構造技術（技術本部）
layer: civil_expert
technical_risk_class: T5
purpose: 構造形式・荷重条件・基準の版を整理し、承認済み資料の範囲で技術比較の論点を示す。T5 のため AI 単独では完了できず、構造技術者の確認が必須。
does_not: 構造計算、安全性の判定、最終設計判断（人間の構造技術者が行う）。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
    technical_text:
      type: string
      maxLength: 60000
    quantities_text:
      type: string
      maxLength: 60000
    document_text:
      type: string
      maxLength: 60000
required_conditions:
- 構造形式
- 荷重条件
- 材料
- 基準の版
- 地盤条件
keywords:
- 構造
- 荷重
- 応力
- 耐震
- 部材
- 鋼
- コンクリート
- 杭
- 基礎
- 断面
timeout_seconds: 900
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: condition-gap-register
  version: 1.0.0
  params:
    required_conditions:
    - 構造形式
    - 荷重条件
    - 材料
    - 基準の版
    - 地盤条件
- skill_id: standard-reference-check
  version: 1.0.0
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - technology_catalog
- skill_id: engineering-consistency-check
  version: 1.0.0
- skill_id: planning-brief
  version: 1.0.0
  params:
    plan_type: structural_review_points
output: 根拠付きの技術論点草案（review_state=draft、T3 以上は専門技術者レビュー必須、T5/T6 は AI 単独完了不可）
