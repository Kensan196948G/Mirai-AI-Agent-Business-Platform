schema_version: mirai.agent-definition/v1
agent_id: port-marine-expert
version: 1.0.0
domain_pack: mirai-construction
title: 港湾・海上 専門Agent
owner_role: 港湾技術（技術本部）
layer: civil_expert
technical_risk_class: T4
purpose: 港湾・海上工事の技術条件（波浪・潮位・地盤・構造形式）について、承認済み資料を根拠に候補技術の適用条件と不足情報を整理する。
does_not: 構造・施工の可否判断、波浪条件の推定、設備・船舶の制御。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
    technical_text:
      type: string
      maxLength: 60000
    quantities_text:
      type: string
      maxLength: 60000
    document_text:
      type: string
      maxLength: 60000
required_conditions:
- 設計波
- 潮位
- 水深
- 地盤条件
- 施工時期
keywords:
- 港湾
- 海上
- 防波堤
- ケーソン
- 岸壁
- 護岸
- 浚渫
- 消波
- 潜堤
- 係船
- 桟橋
timeout_seconds: 900
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: condition-gap-register
  version: 1.0.0
  params:
    required_conditions:
    - 設計波
    - 潮位
    - 水深
    - 地盤条件
    - 施工時期
- skill_id: standard-reference-check
  version: 1.0.0
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - technology_catalog
    - project_case
- skill_id: applicability-gap-check
  version: 1.0.0
- skill_id: technology-comparison
  version: 1.0.0
- skill_id: engineering-consistency-check
  version: 1.0.0
- skill_id: evidence-backed-draft
  version: 1.0.0
output: 根拠付きの技術論点草案（review_state=draft、T3 以上は専門技術者レビュー必須、T5/T6 は AI 単独完了不可）
