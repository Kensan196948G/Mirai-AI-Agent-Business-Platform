schema_version: mirai.agent-definition/v1
agent_id: branch-support
version: 1.0.0
domain_pack: mirai-construction
title: 支店・営業所支援（共通）
owner_role: 支店長 / 営業所長
layer: organization
org_code: '07'
technical_risk_class: T2
purpose: 支店・営業所の地域文脈を固定したうえで、承認済みの施工実績・技術資料を集め、地域案件の論点を整理する。支店ごとのデータ境界（地域外の非公開情報を混ぜない）を守る。
does_not: 受注・価格の決定、他支店の非公開案件の参照、地域 KPI の推定。
max_autonomy_level: A1
input_contract:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 4000
    branch:
      type: string
      maxLength: 40
delegates_to:
- geotechnical-expert
- maintenance-expert
- port-marine-expert
- project-case-research
- technology-selection
timeout_seconds: 600
budget_usd: 0.5
model_category: Research / Classification
skills:
- skill_id: regional-context
  version: 1.0.0
  params:
    allowed_classification: authorized
- skill_id: knowledge-brief
  version: 1.0.0
  params:
    source_types:
    - project_case
    - technology_catalog
- skill_id: planning-brief
  version: 1.0.0
  params:
    plan_type: regional_overview
output: 論点・根拠・不明点を含む草案（review_state=draft、人間レビュー必須）
