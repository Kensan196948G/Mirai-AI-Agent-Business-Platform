schema_version: "mirai.agent-backlog-catalog/v1"
pack_id: "mirai-construction"
# =============================================================================
# P2 / P3 の Agent 候補カタログ（実行不能）
#
# ここに列挙した候補は「将来の拡張候補」であり、実行可能な Agent 定義ではない。
# - agents/ ディレクトリには置かない（skill-loader の loadAgentDefinition は agents/ 配下しか読まないため、
#   sync-agent-registry.mjs で誤って承認済み版として登録されることはない）
# - 存在しない Tool・API・専門システム接続を「成功する Stub」で埋めない
# - 各候補を有効化するには、責任者ロールの評価・受入れ、必要資料の利用許諾、
#   評価条件の確定、外部接続の仕様・権限確認を経て、agents/ 配下へ正式定義を追加する必要がある
#
# 出典: docs/Mirai-Agent-Skill-Architecture.md §6（Agent カタログ）・§9（P2/P3 Backlog）
# =============================================================================
stage_definitions:
  P2: "港湾・地盤・維持管理・安全品質環境・研究等の文書支援。各専門Ownerの評価・受入れと必要なデータ利用承認が完了判断"
  P3: "仕様・権限を確認した専門システムの読み取り連携。契約試験・照合・障害時停止が検証済みであることが完了判断"

candidates:
  - id: A03
    agent_id: port-marine-construction-planning
    title: "港湾・海上施工計画支援"
    stage: P2
    enabled: false
    owner_role: "施工・港湾技術"
    skill_candidates:
      - "浚渫・埋立・護岸等の計画論点整理"
      - "工程制約抽出"
      - "承認済み気海象情報の鮮度確認"
    main_deliverable: "計画レビュー用チェック表"
    required_materials:
      - "承認済みの港湾施工計画資料（社内レビュー済み）"
      - "気海象情報の取得元・更新頻度・利用条件"
    evaluation_conditions:
      - "港湾技術 Owner が計画論点の抜け漏れを実測で評価すること"
      - "気海象情報の鮮度判定が誤って「最新」と表示しないこと"
    forbidden:
      - "施工可否・工程の最終決定"
      - "船舶・設備への制御指示"
      - "気海象情報の自動取得・外部送信"
    unconfirmed_external_connections:
      - "気海象情報提供元の API 仕様・契約・認証"

  - id: A04
    agent_id: ground-improvement-support
    title: "地盤改良支援"
