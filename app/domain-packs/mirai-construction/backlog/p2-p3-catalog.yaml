      - "CPG 等の候補比較"
      - "品質記録チェック"
    main_deliverable: "工法候補比較・照査事項"
    required_materials:
      - "技術者承認済みの CPG 適用資料（公開概要ではなく社内基準）"
      - "地盤調査記録のフォーマットと分類"
    evaluation_conditions:
      - "地盤技術 Owner が候補比較の妥当性を評価すること"
      - "公開紹介だけを根拠に工法確定へ誘導しないこと"
    forbidden:
      - "工法採用・施工設計の確定"
      - "公開ページのみを根拠にした適用判断"
    unconfirmed_external_connections: []

