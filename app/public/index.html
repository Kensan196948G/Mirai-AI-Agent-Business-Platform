<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mirai AgentOS — ログイン</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 10vh auto; }
  input { display: block; width: 100%; margin: 0.5em 0; padding: 0.5em; box-sizing: border-box; }
  button { padding: 0.5em 1em; }
  #error { color: #b00020; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Mirai AgentOS</h1>
<form id="login-form">
  <input type="email" id="email" placeholder="email" required autocomplete="username">
  <input type="password" id="password" placeholder="password" required autocomplete="current-password">
  <button type="submit">ログイン</button>
  <div id="error"></div>
</form>
<script type="module">
import { api } from './app.js';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    await api('/api/auth/login', { method: 'POST', body: { email, password } });
    location.href = './dashboard.html';
  } catch (err) {
    document.getElementById('error').textContent = err.message;
  }
});
</script>
</body>
</html>
