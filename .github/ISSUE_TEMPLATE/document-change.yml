name: 文書の追加・修正
description: 文書の誤り・不足・更新依頼を起票する
title: "[文書] "
labels: ["documentation"]
body:
  - type: input
    id: target
    attributes:
      label: 対象文書
      description: リポジトリ内のパス
      placeholder: docs/ai-dx-dev-saas-setup-guide.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現状の記述と問題点
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: あるべき記述
    validations:
      required: true
  - type: checkboxes
    id: consistency
    attributes:
      label: 整合性の確認
      options:
        - label: 他の文書（正本マップ上の関連文書）にも同じ修正が必要か確認した
        - label: 秘密情報・個人情報を本文に含めていない
