name: docs-quality

# 本リポジトリは「自前アプリの新規開発を行わない」ドキュメント正本のため、
# CI の対象はアプリのビルドではなく「文書の整合性・秘密情報混入の有無」である。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 文書整合性・秘密情報検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: チェックアウト（全履歴：秘密情報の履歴走査に必要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 秘密情報スキャンは gitleaks（MIT）の公式リリースバイナリを使う。
      # gitleaks-action は v2.0.0 以降が商用 EULA であり、Organization 配下では
      # ライセンスキー（production secret の追加）と第三者サービスへの
      # リポジトリ名送信が必要になるため採用しない。
      # バージョンと SHA256 を固定し、改ざんされた成果物を実行しない。
      - name: 秘密情報スキャン（gitleaks・履歴全体）
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # --redact: 検出値をログ・レポートへ出力しない（値の二次流出を防ぐ）
          ./gitleaks git . --redact --no-banner
          rm -f gitleaks gitleaks.tar.gz

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存関係の確認（npm 外部依存ゼロであること）
        run: |
          if [ -d node_modules ]; then
            echo "node_modules がコミットされている" >&2
            exit 1
          fi
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) { console.error('本リポジトリは外部依存ゼロを維持する'); process.exit(1); }"

      - name: ユニットテスト（node --test）
        run: npm test

      - name: 文書整合性チェック（DOC001-DOC006）
        run: npm run check

      - name: 追跡対象に .env が含まれていないこと
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' ; then
            echo "::error::.env が Git 管理下にある" && exit 1
          fi
          echo "OK: .env は追跡されていない"
